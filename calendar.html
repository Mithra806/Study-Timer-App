<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="calendarStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="nav-buttons">
                    <button class="nav-btn" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <button class="nav-btn" id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="month-year" id="month-year">June 2026</div>
            </div>
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days" id="days"></div>
            <div class="calendar-footer">
                <button class="today-btn" id="today-btn"><i class="fas fa-calendar-day"></i></button>
                <div class="event-indicator">
                    <i class="fas fa-circle" style="color: var(--accent); font-size: 0.6rem;"></i>
                    <span>Has events</span>
                </div>
            </div>
        </div>
        <div class="event-panel" id="event-panel">
            <div class="event-header">
                <div class="event-date" id="event-date">Select a date</div>
                <i class="fas fa-calendar-alt event-icon"></i>
            </div>
            <div class="event-list" id="event-list">
                <div class="no-events">Select a date with events to view them here</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const monthYearEl = document.getElementById('month-year');
            const daysEl = document.getElementById('days');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const todayBtn = document.getElementById('today-btn');
            const eventPanel = document.getElementById('event-panel');
            const eventDateEl = document.getElementById('event-date');
            const eventListEl = document.getElementById('event-list');

            // Sample events data. Key format: "YYYY-M-D" (month is 1-indexed).
            // Add your own entries here, e.g. "2026-6-15": [{ time: "10:00 AM", text: "Team meeting" }]
            const events = {};

            let currentDate = new Date();
            let selectedDate = null;

            const monthNames = [
                "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"
            ];
            const dayNames = [
                "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
            ];

            // Builds a consistent "YYYY-M-D" key (1-indexed month) for any Date object.
            function toDateKey(year, month1Indexed, day) {
                return `${year}-${month1Indexed}-${day}`;
            }

            function renderCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth(); // 0-indexed

                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const prevLastDay = new Date(year, month, 0);

                const firstDayIndex = firstDay.getDay();
                const lastDayIndex = lastDay.getDay();
                const nextDays = 7 - lastDayIndex - 1;

                monthYearEl.innerHTML = `${monthNames[month]} ${year}`;

                let days = "";

                // --- Trailing days from the previous month ---
                for (let x = firstDayIndex; x > 0; x--) {
                    const prevDate = prevLastDay.getDate() - x + 1;
                    // Previous month/year, accounting for January rollover
                    const prevMonth = month === 0 ? 12 : month;
                    const prevYear = month === 0 ? year - 1 : year;
                    const dateKey = toDateKey(prevYear, prevMonth, prevDate);
                    const hasEvent = events[dateKey] !== undefined;

                    days += `<div class="day other-month${hasEvent ? ' has-events' : ''}">${prevDate}</div>`;
                }

                // --- Days of the current month ---
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    const date = new Date(year, month, i);
                    const dateKey = toDateKey(year, month + 1, i);
                    const hasEvent = events[dateKey] !== undefined;

                    let dayClass = 'day';

                    const today = new Date();
                    if (
                        date.getDate() === today.getDate() &&
                        date.getMonth() === today.getMonth() &&
                        date.getFullYear() === today.getFullYear()
                    ) {
                        dayClass += ' today';
                    }

                    if (
                        selectedDate &&
                        date.getDate() === selectedDate.getDate() &&
                        date.getMonth() === selectedDate.getMonth() &&
                        date.getFullYear() === selectedDate.getFullYear()
                    ) {
                        dayClass += ' selected';
                    }

                    if (hasEvent) {
                        dayClass += ' has-events';
                    }

                    days += `<div class="${dayClass}" data-date="${dateKey}">${i}</div>`;
                }

                // --- Leading days from the next month ---
                for (let j = 1; j <= nextDays; j++) {
                    const nextMonth = month === 11 ? 1 : month + 2;
                    const nextYear = month === 11 ? year + 1 : year;
                    const dateKey = toDateKey(nextYear, nextMonth, j);
                    const hasEvent = events[dateKey] !== undefined;

                    days += `<div class="day other-month${hasEvent ? ' has-events' : ''}">${j}</div>`;
                }

                daysEl.innerHTML = days;

                document.querySelectorAll('.day:not(.other-month)').forEach(day => {
                    day.addEventListener('click', () => {
                        const dateStr = day.getAttribute('data-date');
                        const [year, month, dayNum] = dateStr.split('-').map(Number);
                        selectedDate = new Date(year, month - 1, dayNum);
                        renderCalendar();
                        showEvents(dateStr);
                    });
                });
            }

            function showEvents(dateStr) {
                const [year, month, day] = dateStr.split('-').map(Number);
                const dateObj = new Date(year, month - 1, day);
                const dayName = dayNames[dateObj.getDay()];

                eventDateEl.textContent = `${dayName}, ${monthNames[dateObj.getMonth()]} ${day}, ${year}`;

                eventListEl.innerHTML = '';

                if (events[dateStr] && events[dateStr].length > 0) {
                    events[dateStr].forEach(event => {
                        const eventItem = document.createElement('div');
                        eventItem.className = 'event-item';
                        eventItem.innerHTML = `
                            <div class="event-color"></div>
                            <div class="event-time">${event.time}</div>
                            <div class="event-text">${event.text}</div>
                        `;
                        eventListEl.appendChild(eventItem);
                    });
                } else {
                    eventListEl.innerHTML = '<div class="no-events">No events scheduled for this day</div>';
                }
            }

            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
                eventDateEl.textContent = 'Select a date';
                eventListEl.innerHTML = '<div class="no-events">Select a date with events to view them here</div>';
            });

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
                eventDateEl.textContent = 'Select a date';
                eventListEl.innerHTML = '<div class="no-events">Select a date with events to view them here</div>';
            });

            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                selectedDate = new Date();
                renderCalendar();

                const dateStr = toDateKey(currentDate.getFullYear(), currentDate.getMonth() + 1, currentDate.getDate());
                showEvents(dateStr);
            });

            renderCalendar();
        });
    </script>
</body>
</html>
