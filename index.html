<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer App</title>
    <link rel="stylesheet" href="timerStyle.css">
</head>
<body>
    <nav>
        <a href="#" id="todo-link">Todo List</a>
        <a href="#" id="calendar-link">Calendar</a>
    </nav>
    <div class="container">
        <h1>Study Timer App</h1>
        <hr>

        <p class="timer" id="timer">25:00</p>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="stop">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const start = document.getElementById("start");
        const stop = document.getElementById("stop");
        const reset = document.getElementById("reset");
        const timer = document.getElementById("timer");

        let timeLeft = 1500;
        let timerInterval;

        const updateTimer = () => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timer.innerHTML = `${minutes.toString().padStart(2, "0")}:${seconds
                .toString()
                .padStart(2, "0")}`;
        };

        const startTimer = () => {
            if (timerInterval) return; // prevents multiple intervals

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("Time's up!");
                    timeLeft = 1500;
                    updateTimer();
                }
            }, 1000);
        };

        const stopTimer = () => {
            clearInterval(timerInterval);
            timerInterval = null;
        };

        const resetTimer = () => {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 1500;
            updateTimer();
        };

        start.addEventListener("click", startTimer);
        stop.addEventListener("click", stopTimer);
        reset.addEventListener("click", resetTimer);

        updateTimer();
    </script>
</body>
</html>
